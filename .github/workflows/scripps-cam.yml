name: Scripps cam capture

# Grabs one Scripps underwater-cam frame ~hourly during daylight, runs the
# vision viz estimate (Haiku — cheap), and appends a paired
# (Scripps NTU+chl -> cam-viz) row to a training CSV on the `cam-data` branch.
#
# COST: only the vision estimate is paid (Anthropic API, ~$0.009/call on Haiku,
# ~15 daylight runs/day => ~$4-8/mo). Frame + NTU/chl capture is free. This is
# API billing, SEPARATE from any Claude subscription.
#
# SETUP (one time):
#   1. Add repo secret  ANTHROPIC_API_KEY   (Settings > Secrets > Actions).
#   2. (optional) Add repo variable CAM_MODEL if the default Haiku id below is
#      wrong for your account (Settings > Variables > Actions). If estimates come
#      back blank in the CSV, that's the likely cause — set CAM_MODEL and re-run.
#   3. Trigger once via "Run workflow" and confirm the cam_training_log.csv rows
#      on the `cam-data` branch get viz labels.
#
# WHY cam-data branch: keeps the growing CSV OFF main, so it never triggers a
# Cloudflare Pages rebuild. Frames are kept as 90-day run artifacts (durable
# frame storage is a later decision; the CSV holds the permanent labels).
#
# NOTE: does NOT post to the public Recent Reports feed (would flood it). To
# post occasionally, run scripts/scripps_capture.sh --post manually.

on:
  schedule:
    # Top of the hour across the daylight UTC window (~6am-8pm PT year-round);
    # scripps_capture.sh applies the exact America/Los_Angeles daylight gate.
    - cron: '0 13-23,0-4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the daylight gate (for on-demand test/capture, e.g. at night)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scripps-cam
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main — scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + estimator deps
        # System ffmpeg via apt (the imageio-ffmpeg static build segfaults on the
        # runner over HLS/TLS); capture.sh picks it up via `command -v ffmpeg`.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install anthropic pydantic

      - name: Prepare cam-data branch (worktree)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune
          if git show-ref --verify --quiet refs/remotes/origin/cam-data; then
            git worktree add _data origin/cam-data
            git -C _data switch -C cam-data
          else
            git worktree add -b cam-data _data
            ( cd _data && git rm -rq . >/dev/null 2>&1 || true )
          fi

      - name: Capture + estimate + log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAM_MODEL: ${{ vars.CAM_MODEL || 'claude-haiku-4-5' }}
          CSV: ${{ github.workspace }}/_data/cam_training_log.csv
          FRAME_DIR: ${{ github.workspace }}/_frames
          # force=true (manual dispatch) widens the daylight gate to 24h so we can
          # test/capture on demand (e.g. verify the model call at night).
          START_HOUR: ${{ github.event.inputs.force == 'true' && '0' || '6' }}
          END_HOUR: ${{ github.event.inputs.force == 'true' && '24' || '20' }}
        run: ./scripts/scripps_capture.sh

      - name: Upload frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-${{ github.run_id }}
          path: _frames/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit training row to cam-data
        run: |
          cd _data
          git add -A
          git commit -m "cam data $(date -u +%FT%TZ)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:cam-data
